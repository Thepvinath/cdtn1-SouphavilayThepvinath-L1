# Smart CRM - Mekong Mobile · run with:
#   cp .env.example .env
#   docker compose up -d --build
# Then open http://localhost:${WEB_PORT} (default 8080). See docs/deployment-guide.md.

name: smartcrm

services:
  db:
    image: mysql:8.0
    # BUG-07: values come from the .env FILE (env_file), never from ${...} interpolation,
    # so a DB_USER/DB_PASSWORD variable already set on the host cannot override them.
    # The official image expects MYSQL_*; map them from DB_* before its entrypoint runs.
    env_file: .env
    entrypoint:
      - sh
      - -c
      - >-
        export MYSQL_DATABASE="$$DB_NAME" MYSQL_USER="$$DB_USER"
        MYSQL_PASSWORD="$$DB_PASSWORD" MYSQL_ROOT_PASSWORD="$$DB_ROOT_PASSWORD";
        exec docker-entrypoint.sh mysqld
        --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$DB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # No "ports": the database is only reachable inside the compose network.

  api:
    build: .
    env_file: .env                      # BUG-07: read from the file, not from host variables
    environment:
      DB_HOST: db                       # service name, not localhost
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    # No "ports": the API is reached through the web service at /api.

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  dbdata: {}
